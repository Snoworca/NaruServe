rootProject.name = 'naruserve-java-example'
// Source checkout build. Pass -PtinyHttpdDir=/absolute/path/to/TinyHttpd when needed.
// The published artifactIds are lower case; the source projects keep their names.
includeBuild('../..') {
    dependencySubstitution {
        substitute module('com.snoworca.naruserve:naruserve') using project(':NaruServe')
    }
}
