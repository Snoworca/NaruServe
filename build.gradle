// The only build file: every module is configured here; the one exception is the release-only script applied at
// the end under -Prelease (CON-BUILD-017).
plugins {
    id 'java'
    id 'ru.vyarus.animalsniffer' version '2.0.1' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.2.0' apply false
}

def kotlinVersion = '2.2.0'

// @req CON-BUILD-002
def naruModules = [':NaruServe-api', ':NaruServe-servlet', ':NaruServe-tinyhttpd', ':NaruServe-gson', ':NaruServe',
                   ':NaruServe-kotlin', ':NaruServe-slf4j', ':NaruServe-filelog', ':NaruServe-logcat']
def naruProjects = naruModules.collect { project(it) }

// @req CON-BUILD-012
// @req CON-BUILD-013
// D-027: the modules that ship to Android; servlet and SLF4J are JVM-only.
def androidModules = naruModules - [':NaruServe-servlet', ':NaruServe-slf4j']

allprojects {
    group = 'com.snoworca.naruserve'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }

    // @req FR-STATIC-006 — Java 8 caches canonical paths for up to 30 s; the T29 symlink-swap test needs them live
    tasks.withType(Test).configureEach { systemProperty 'sun.io.useCanonCaches', 'false' }
}

// @req CON-BUILD-004
def configureCompile = { Project p ->
    // The Kotlin plugin compares jvmTarget with these, so they must say 1.8 beside --release 8.
    p.java.sourceCompatibility = JavaVersion.VERSION_1_8
    p.java.targetCompatibility = JavaVersion.VERSION_1_8
    // Java 8 language level, compiled with --release so only Java 8 class library APIs resolve.
    p.tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-options']
    }
    p.plugins.withId('org.jetbrains.kotlin.jvm') {
        p.kotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8)
        // Kotlin reads JSpecify @Nullable/@NonNull as String?/String, never the platform type String!.
        p.kotlin.compilerOptions.freeCompilerArgs.add('-Xjspecify-annotations=strict')
        if (p.path == ':NaruServe-kotlin') {
            // The module ships inline reified helpers, so its metadata level is what consumer apps must read: 1.9 keeps
            // Android apps on Kotlin 1.9/2.0 compiling against it.
            p.kotlin.compilerOptions.languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)
            p.kotlin.compilerOptions.apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9)
        }
    }
}

// Main (api/implementation) dependencies of CON-BUILD-006 AC-1; ':' entries are projects.
def mainDependencies = [
    ':NaruServe-api'      : [:],
    ':NaruServe-servlet'  : [api: [':NaruServe-api']],
    // TinyHttpd stays implementation-scope and versionless: the included build substitutes the coordinates.
    ':NaruServe-tinyhttpd': [api: [':NaruServe-api'],
                             implementation: ['com.snoworca.tinyhttpd:tinyhttpd-core',
                                              'com.snoworca.tinyhttpd:tinyhttpd-websocket']],
    // api scope: GsonJsonCodec takes a caller-built Gson (CON-BUILD-006 AC-9).
    ':NaruServe-gson'     : [api: [':NaruServe-api', 'com.google.code.gson:gson:2.14.0']],
    ':NaruServe'          : [api: [':NaruServe-api'],
                             implementation: [':NaruServe-tinyhttpd', ':NaruServe-gson', ':NaruServe-logcat']],
    ':NaruServe-kotlin'   : [api: [':NaruServe-api', "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"]],
    // api scope: the public Slf4jLogger(org.slf4j.Logger) constructor exposes the SLF4J type.
    ':NaruServe-slf4j'    : [api: [':NaruServe-api', 'org.slf4j:slf4j-api:1.7.36']],
    ':NaruServe-filelog'  : [api: [':NaruServe-api']],
    ':NaruServe-logcat'   : [api: [':NaruServe-api']],
]

// compileOnly dependencies of CON-BUILD-006 AC-2 besides the nullability library every module gets.
def extraCompileOnly = [
    ':NaruServe-servlet': ['javax.servlet:javax.servlet-api:3.1.0', 'javax.websocket:javax.websocket-api:1.1'],
]

// @req CON-BUILD-006
// @req CON-BUILD-009
// @req CON-BUILD-011
def configureDependencies = { Project p ->
    mainDependencies[p.path].each { String configuration, List<String> notations ->
        notations.each { n -> p.dependencies.add(configuration, n.startsWith(':') ? p.project(n) : n) }
    }
    p.dependencies.add('compileOnly', 'org.jspecify:jspecify:1.0.0')
    extraCompileOnly.getOrDefault(p.path, []).each { p.dependencies.add('compileOnly', it) }

    p.dependencies.add('testImplementation', 'org.jspecify:jspecify:1.0.0')
    p.dependencies.add('testImplementation', 'junit:junit:4.13.2')
    // kotlin.stdlib.default.dependency=false, so Kotlin tests get the stdlib in test scope only.
    p.dependencies.add('testImplementation', "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}")
}

// @req CON-BUILD-008
// @req CON-BUILD-013
// Constant-pool scan: CONSTANT_Class names and `L<name>;` descriptors whose internal name starts with a prefix.
def scanClassRefs = { FileCollection classesDirs, List<String> prefixes ->
    def forbidden = { String name -> prefixes.any { name.startsWith(it) } }
    def hits = new TreeSet<String>()
    classesDirs.asFileTree.matching { include '**/*.class' }.files.each { File f ->
        new DataInputStream(new BufferedInputStream(new FileInputStream(f))).withCloseable { DataInputStream input ->
            input.readInt()
            input.readUnsignedShort()
            input.readUnsignedShort()
            int count = input.readUnsignedShort()
            Map<Integer, String> utf8 = [:]
            Map<Integer, Integer> classNames = [:]
            for (int i = 1; i < count; i++) {
                int tag = input.readUnsignedByte()
                switch (tag) {
                    case 1: utf8[i] = input.readUTF(); break
                    case 7: classNames[i] = input.readUnsignedShort(); break
                    case [8, 16, 19, 20]: input.skipBytes(2); break
                    case 15: input.skipBytes(3); break
                    case [3, 4, 9, 10, 11, 12, 17, 18]: input.skipBytes(4); break
                    case [5, 6]: input.skipBytes(8); i++; break
                    default: throw new GradleException("checkClassReferences: unknown constant pool tag ${tag} in ${f}")
                }
            }
            input.readUnsignedShort()
            String self = utf8[classNames[input.readUnsignedShort()]]
            def refs = new TreeSet<String>()
            classNames.values().each { refs << utf8[it] }
            utf8.values().each { String s -> (s =~ /L([^;<>()\[\]]+);/).each { refs << it[1] } }
            refs.findAll(forbidden).each { hits << "${self} -> ${it}".toString() }
        }
    }
    hits as List<String>
}

// @req CON-BUILD-008
// @req CON-BUILD-013
// @req CON-APP-001
def classRefPrefixes = { String path ->
    def prefixes = path in androidModules ? ['javax/servlet/'] : []
    if (path == ':NaruServe-api') {
        prefixes += ['android/', 'jakarta/servlet/', 'com/google/gson/', 'com/snoworca/tinyhttpd/', 'kotlin/']
        prefixes += ['org/slf4j/']
    }
    if (path == ':NaruServe-logcat') {
        prefixes += ['android/']
    }
    // @req IR-SVL-001
    // v1 is javax.servlet 3.1 only; a jakarta.servlet module is a later decision.
    if (path == ':NaruServe-servlet') {
        prefixes += ['jakarta/servlet/']
    }
    prefixes
}

// @req FR-REL-005
// mavenLocal only: the publishing block declares no repository. The POM takes each dependency's resolved version, so the
// versionless TinyHttpd declarations publish as the included build's 0.1.0-SNAPSHOT.
def configurePublishing = { Project p ->
    p.apply plugin: 'maven-publish'
    p.publishing {
        publications {
            maven(MavenPublication) {
                // p., or the closure owner (the root project, which applies 'java') would be used.
                from p.components.java
                versionMapping { allVariants { fromResolutionResult() } }
            }
        }
    }
    // The in-memory adapter test fixtures of NaruServe-api are for this build's tests, not for consumers.
    p.plugins.withId('java-test-fixtures') {
        ['testFixturesApiElements', 'testFixturesRuntimeElements'].each { cn ->
            p.components.java.withVariantsFromConfiguration(p.configurations.getByName(cn)) { skip() }
        }
    }
}

configure(naruProjects) { p ->
    apply plugin: 'java-library'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    configureCompile(p)
    configureDependencies(p)
    configurePublishing(p)

    test {
        useJUnit()
    }

    def prefixes = classRefPrefixes(p.path)
    if (!prefixes.isEmpty()) {
        def checkClassReferences = p.tasks.register('checkClassReferences') {
            description = 'Fails when main classes reference a package this module must not use.'
            group = 'verification'
            def classesDirs = p.sourceSets.main.output.classesDirs
            dependsOn p.tasks.named('classes')
            doLast {
                def hits = scanClassRefs(classesDirs, prefixes)
                if (!hits.isEmpty()) {
                    throw new GradleException("checkClassReferences: ${p.path} main classes reference forbidden packages:\n  "
                            + hits.join('\n  '))
                }
            }
        }
        p.tasks.named('check') { dependsOn checkClassReferences }
    }
}

