    dependencies {
        testImplementation testFixtures(project(':NaruServe-api'))
    }
    // Tests that count the app's threads by name run one JVM per class, so no other app's threads are alive
    // (FR-APP-020 AC-9, PERF-APP-001 AC-1); the ordinary test task leaves them out.
    // @req FR-APP-020
    def isolatedTest = tasks.register('isolatedTest', Test) {
        description = 'Runs the *IsolatedSocketTest classes, one test JVM per class.'
