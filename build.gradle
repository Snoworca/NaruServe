plugins {
    id 'ru.vyarus.animalsniffer' version '2.0.1' apply false
}

allprojects {
    group = 'com.snoworca.naruserve'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    // Java 8 language level, compiled with --release so only Java 8 class library APIs resolve.
    tasks.withType(JavaCompile).configureEach {
        options.release = 8
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:-options']
    }
}

project(':NaruServe-api') {
    apply plugin: 'ru.vyarus.animalsniffer'

    // Android 5.0 (API 21) is the minimum runtime: fail the build on any API that API 21 lacks.
    animalsniffer {
        sourceSets = [sourceSets.main]
    }

    dependencies {
        signature 'net.sf.androidscents.signature:android-api-level-21:5.0.1_r2@signature'
    }
}

// JVM-only: Servlet API never reaches Android, so no API 21 check here.
project(':NaruServe-servlet') {
    dependencies {
        api project(':NaruServe-api')
        compileOnly 'javax.servlet:javax.servlet-api:3.1.0'
    }
}
