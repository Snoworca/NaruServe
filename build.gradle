        exclude '**/*IsolatedSocketTest*'
        if (!providers.gradleProperty('tinyHttpdFromMaven').getOrElse('false').toBoolean()) {
            exclude '**/PublishedTinyHttpdCompatibilityTest*'
        }
    }
    tasks.named('check') { dependsOn isolatedTest }
}

