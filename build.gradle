// @req CON-BUILD-007
// @req CON-BUILD-009
// @req CON-BUILD-013
def dependencyReport = layout.buildDirectory.file('reports/naruserve/dependency-graphs.txt')
ext.dependencyReport = dependencyReport // read by gradle/release.gradle
def checkDependencyRules = tasks.register('checkDependencyRules') {
    description = 'Fails on kotlin-stdlib outside NaruServe-kotlin, a Gson other than 2.14.0 or a misplaced TinyHttpd.'
    group = 'verification'
    def reportFile = dependencyReport.get().asFile
    def modules = naruProjects
    doLast {
        def lines = []
        def violations = []
        modules.each { Project p ->
            def path = p.path
            ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { String cn ->
                def result = p.configurations.getByName(cn).incoming.resolutionResult
                result.root.dependencies.each { dep ->
                    if (dep instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                        violations << "unresolved ${dep.attempted.displayName} on ${cn} of ${path}"
                    } else {
                        def mv = dep.selected.moduleVersion
                        if (mv.group == 'com.snoworca.tinyhttpd' && path != ':NaruServe-tinyhttpd') {
                            violations << "${mv.group}:${mv.name} declared by ${path} (only :NaruServe-tinyhttpd may)"
                        }
                    }
                }
                result.allComponents.each { c ->
                    def mv = c.moduleVersion
                    def coordinate = "${mv.group}:${mv.name}:${mv.version}"
                    lines << "${path}|${cn}|${coordinate}"
                    if (mv.group == 'org.jetbrains.kotlin' && mv.name == 'kotlin-stdlib' && path != ':NaruServe-kotlin'
                            && cn in ['compileClasspath', 'runtimeClasspath']) {
                        violations << "kotlin-stdlib on ${cn} of ${path} (only :NaruServe-kotlin may ship it)"
                    }
                    if (mv.group == 'com.google.code.gson' && mv.name == 'gson' && mv.version != '2.14.0') {
                        violations << "${coordinate} on ${cn} of ${path} (Gson must resolve to 2.14.0)"
                    }
                    if (mv.group == 'com.snoworca.tinyhttpd' && mv.name in ['tinyhttpd-router', 'tinyhttpd-session']) {
                        violations << "${mv.group}:${mv.name} on ${cn} of ${path} (router and session are not used)"
                    }
                    if (mv.group == 'com.snoworca.tinyhttpd' && path != ':NaruServe-tinyhttpd'
                            && cn in ['compileClasspath', 'testCompileClasspath']) {
                        violations << "${mv.group}:${mv.name} on ${cn} of ${path} (TinyHttpd stays implementation-scope)"
                    }
                    // @req CON-SVL-001
                    boolean jetty = mv.group.startsWith('org.eclipse.jetty')
                    if ((jetty || mv.group == 'javax.servlet') && path != ':NaruServe-servlet') {
                        violations << "${coordinate} on ${cn} of ${path} (Jetty and javax.servlet stay in :NaruServe-servlet)"
                    }
                    if (jetty && path == ':NaruServe-servlet' && cn in ['compileClasspath', 'runtimeClasspath']) {
                        violations << "${coordinate} on ${cn} of ${path} (the embedded container is test scope only)"
                    }
                    if (mv.group == 'jakarta.servlet') {
                        violations << "${coordinate} on ${cn} of ${path} (no jakarta.servlet in v1)"
                    }
                }
            }
        }
        reportFile.parentFile.mkdirs()
        reportFile.text = lines.join('\n') + '\n'
        if (!violations.isEmpty()) {
            throw new GradleException("checkDependencyRules:\n  " + violations.unique().join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn checkDependencyRules }

// @req CON-KT-001
// Separate from checkClassReferences, whose pinned prefix lists stay as wave 1 fixed them; 'kotlin/' misses 'kotlinx/'.
def checkNoCoroutines = tasks.register('checkNoCoroutines') {
    description = 'Fails when a published module references kotlinx.coroutines or resolves a kotlinx-coroutines artifact.'
    group = 'verification'
    def modules = naruProjects
    def classesDirs = modules.collectEntries { Project p -> [p.path, p.sourceSets.main.output.classesDirs] }
    dependsOn modules.collect { it.tasks.named('classes') }
    doLast {
        def violations = []
        classesDirs.each { String path, FileCollection dirs -> violations.addAll(scanClassRefs(dirs, ['kotlinx/coroutines/'])) }
        modules.each { Project p ->
            ['compileClasspath', 'runtimeClasspath'].each { String cn ->
                p.configurations.getByName(cn).incoming.resolutionResult.allComponents.each { c ->
                    def mv = c.moduleVersion
                    if (mv.group == 'org.jetbrains.kotlinx' && mv.name.startsWith('kotlinx-coroutines')) {
                        violations << "${p.path} ${cn} -> ${mv.group}:${mv.name}".toString()
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("checkNoCoroutines:\n  " + violations.unique().join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn checkNoCoroutines }

// @req CON-APP-001
// Each logger class sits in its own module jar and no class of a logger package sits in the api jar.
def loggerClasses = [
    ':NaruServe-filelog': 'com/snoworca/naruserve/filelog/RotatingFileLogger.class',
    ':NaruServe-slf4j'  : 'com/snoworca/naruserve/slf4j/Slf4jLogger.class',
    ':NaruServe-logcat' : 'com/snoworca/naruserve/logcat/LogcatLogger.class',
]
def checkLoggerPlacement = tasks.register('checkLoggerPlacement') {
    description = 'Fails when a logger class sits in the NaruServe-api jar or is missing from its module jar.'
    group = 'verification'
    def jars = ([':NaruServe-api'] + loggerClasses.keySet()).collectEntries { path ->
        [path, project(path).tasks.named('jar').flatMap { it.archiveFile }]
    }
    dependsOn jars.keySet().collect { "${it}:jar" }
    doLast {
        def entries = { String path ->
            new java.util.zip.ZipFile(jars[path].get().asFile).withCloseable { z -> z.entries().collect { it.name } }
        }
        def violations = []
        def loggerPackages = loggerClasses.values().collect { it.substring(0, it.lastIndexOf('/') + 1) }
        entries(':NaruServe-api').findAll { e -> loggerPackages.any { e.startsWith(it) && e.endsWith('.class') } }
                .each { violations << "NaruServe-api jar holds ${it}" }
        loggerClasses.each { path, cls ->
            if (!(cls in entries(path))) {
                violations << "${path.substring(1)} jar lacks ${cls}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('checkLoggerPlacement: ' + violations.join('\ncheckLoggerPlacement: '))
        }
    }
}
tasks.named('check') { dependsOn checkLoggerPlacement }

