// @req FR-BUILD-001
// The Android library (AAR): NaruServe plus the Logcat logger and the INTERNET permission of its manifest. No main
// sources, so no Kotlin plugin and no API 21 sniffing of its own; included only when settings.gradle found an SDK.
def androidProject = findProject(':NaruServe-android')
if (androidProject != null) {
    project(':NaruServe-android') { p ->
        repositories {
            google()
        }
        apply plugin: 'com.android.library'
        apply plugin: 'maven-publish'
        android {
            namespace = 'com.snoworca.naruserve.android'
            compileSdk = 36
            buildToolsVersion = '36.0.0'
            defaultConfig {
                minSdk = 21
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_1_8
                targetCompatibility = JavaVersion.VERSION_1_8
            }
            publishing {
                singleVariant('release') {
                    withSourcesJar()
                    withJavadocJar()
                }
            }
        }
        mainDependencies[p.path].each { String configuration, List<String> notations ->
            notations.each { n -> p.dependencies.add(configuration, p.project(n)) }
        }
        p.dependencies.add('compileOnly', 'org.jspecify:jspecify:1.0.0')
        // AGP lint takes the module build file as an input, which CON-BUILD-017 forbids; there is no source to lint.
        p.tasks.matching { it.name.toLowerCase().contains('lint') }.configureEach { enabled = false }
        // FR-REL-005: published like the JAR modules; AGP creates the release component after evaluation.
        afterEvaluate {
            p.publishing {
                publications {
                    release(MavenPublication) {
                        from p.components.release
                        configurePom(p, delegate)
                    }
                }
            }
            centralStagingRepository(p)
        }
    }
}

// Android 5.0 (API 21) is the minimum runtime: fail the build on any API that API 21 lacks.
configure(androidModules.collect { project(it) }) {
    apply plugin: 'ru.vyarus.animalsniffer'

    animalsniffer {
        sourceSets = [sourceSets.main]
    }

    dependencies {
        signature 'net.sf.androidscents.signature:android-api-level-21:5.0.1_r2@signature'
    }
}

// @req CON-BUILD-007
// @req CON-BUILD-009
// @req CON-BUILD-013
def dependencyReport = layout.buildDirectory.file('reports/naruserve/dependency-graphs.txt')
ext.dependencyReport = dependencyReport // read by gradle/release.gradle
def checkDependencyRules = tasks.register('checkDependencyRules') {
    description = 'Fails on kotlin-stdlib outside NaruServe-kotlin, a Gson other than 2.14.0 or a misplaced TinyHttpd.'
    group = 'verification'
    def reportFile = dependencyReport.get().asFile
    // FR-BUILD-001: the AAR's release classpaths fall under the same rules as the JAR modules' main ones.
    def modules = naruProjects + (androidProject != null ? [androidProject] : [])
    def configurationsOf = { Project p ->
        p == androidProject ? ['releaseCompileClasspath', 'releaseRuntimeClasspath']
                : ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
    }
    def mainConfigurations = ['compileClasspath', 'runtimeClasspath', 'releaseCompileClasspath', 'releaseRuntimeClasspath']
    def compileConfigurations = ['compileClasspath', 'testCompileClasspath', 'releaseCompileClasspath']
    doLast {
        // TinyHttpd 3.0.0 publishes under group com.snoworca; the tinyhttpd- name prefix tells it from
        // NaruServe's own group com.snoworca.naruserve (a different group string, so == cannot confuse them).
        def isTinyHttpd = { mv -> mv.group == 'com.snoworca' && mv.name.startsWith('tinyhttpd-') }
        def lines = []
        def violations = []
        modules.each { Project p ->
            def path = p.path
            configurationsOf(p).each { String cn ->
                def result = p.configurations.getByName(cn).incoming.resolutionResult
                result.root.dependencies.each { dep ->
                    if (dep instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult) {
                        violations << "unresolved ${dep.attempted.displayName} on ${cn} of ${path}"
                    } else {
                        def mv = dep.selected.moduleVersion
                        if (isTinyHttpd(mv) && path != ':NaruServe-tinyhttpd') {
                            violations << "${mv.group}:${mv.name} declared by ${path} (only :NaruServe-tinyhttpd may)"
                        }
                    }
                }
                result.allComponents.each { c ->
                    def mv = c.moduleVersion
                    def coordinate = "${mv.group}:${mv.name}:${mv.version}"
                    lines << "${path}|${cn}|${coordinate}"
                    if (mv.group == 'org.jetbrains.kotlin' && mv.name == 'kotlin-stdlib' && path != ':NaruServe-kotlin'
                            && cn in mainConfigurations) {
                        violations << "kotlin-stdlib on ${cn} of ${path} (only :NaruServe-kotlin may ship it)"
                    }
                    if (mv.group == 'com.google.code.gson' && mv.name == 'gson' && mv.version != '2.14.0') {
                        violations << "${coordinate} on ${cn} of ${path} (Gson must resolve to 2.14.0)"
                    }
                    if (isTinyHttpd(mv) && mv.name in ['tinyhttpd-router', 'tinyhttpd-session']) {
                        violations << "${mv.group}:${mv.name} on ${cn} of ${path} (router and session are not used)"
                    }
                    if (isTinyHttpd(mv) && path != ':NaruServe-tinyhttpd'
                            && cn in compileConfigurations) {
                        violations << "${mv.group}:${mv.name} on ${cn} of ${path} (TinyHttpd stays implementation-scope)"
                    }
                    // @req CON-SVL-001
                    boolean jetty = mv.group.startsWith('org.eclipse.jetty')
                    if ((jetty || mv.group == 'javax.servlet') && path != ':NaruServe-servlet') {
                        violations << "${coordinate} on ${cn} of ${path} (Jetty and javax.servlet stay in :NaruServe-servlet)"
                    }
                    if (jetty && path == ':NaruServe-servlet' && cn in mainConfigurations) {
                        violations << "${coordinate} on ${cn} of ${path} (the embedded container is test scope only)"
                    }
                    if (mv.group == 'jakarta.servlet') {
                        violations << "${coordinate} on ${cn} of ${path} (no jakarta.servlet in v1)"
                    }
                }
            }
        }
        reportFile.parentFile.mkdirs()
        reportFile.text = lines.join('\n') + '\n'
        if (!violations.isEmpty()) {
            throw new GradleException("checkDependencyRules:\n  " + violations.unique().join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn checkDependencyRules }

// @req CON-KT-001
// Separate from checkClassReferences, whose pinned prefix lists stay as wave 1 fixed them; 'kotlin/' misses 'kotlinx/'.
def checkNoCoroutines = tasks.register('checkNoCoroutines') {
    description = 'Fails when a published module references kotlinx.coroutines or resolves a kotlinx-coroutines artifact.'
    group = 'verification'
    def modules = naruProjects
    def classesDirs = modules.collectEntries { Project p -> [p.path, p.sourceSets.main.output.classesDirs] }
    dependsOn modules.collect { it.tasks.named('classes') }
    doLast {
        def violations = []
        classesDirs.each { String path, FileCollection dirs -> violations.addAll(scanClassRefs(dirs, ['kotlinx/coroutines/'])) }
        modules.each { Project p ->
            ['compileClasspath', 'runtimeClasspath'].each { String cn ->
                p.configurations.getByName(cn).incoming.resolutionResult.allComponents.each { c ->
                    def mv = c.moduleVersion
                    if (mv.group == 'org.jetbrains.kotlinx' && mv.name.startsWith('kotlinx-coroutines')) {
                        violations << "${p.path} ${cn} -> ${mv.group}:${mv.name}".toString()
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("checkNoCoroutines:\n  " + violations.unique().join('\n  '))
        }
    }
}
tasks.named('check') { dependsOn checkNoCoroutines }

// @req CON-APP-001
// Each logger class sits in its own module jar and no class of a logger package sits in the api jar.
def loggerClasses = [
    ':NaruServe-filelog': 'com/snoworca/naruserve/filelog/RotatingFileLogger.class',
    ':NaruServe-slf4j'  : 'com/snoworca/naruserve/slf4j/Slf4jLogger.class',
    ':NaruServe-logcat' : 'com/snoworca/naruserve/logcat/LogcatLogger.class',
]
def checkLoggerPlacement = tasks.register('checkLoggerPlacement') {
    description = 'Fails when a logger class sits in the NaruServe-api jar or is missing from its module jar.'
    group = 'verification'
    def jars = ([':NaruServe-api'] + loggerClasses.keySet()).collectEntries { path ->
        [path, project(path).tasks.named('jar').flatMap { it.archiveFile }]
    }
    dependsOn jars.keySet().collect { "${it}:jar" }
    doLast {
        def entries = { String path ->
            new java.util.zip.ZipFile(jars[path].get().asFile).withCloseable { z -> z.entries().collect { it.name } }
        }
        def violations = []
        def loggerPackages = loggerClasses.values().collect { it.substring(0, it.lastIndexOf('/') + 1) }
        entries(':NaruServe-api').findAll { e -> loggerPackages.any { e.startsWith(it) && e.endsWith('.class') } }
                .each { violations << "NaruServe-api jar holds ${it}" }
        loggerClasses.each { path, cls ->
            if (!(cls in entries(path))) {
                violations << "${path.substring(1)} jar lacks ${cls}"
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('checkLoggerPlacement: ' + violations.join('\ncheckLoggerPlacement: '))
        }
    }
}
tasks.named('check') { dependsOn checkLoggerPlacement }

// Root tests inspect the module outputs and run TestKit negative cases (OPS-BUILD-002 AC-4).
configureCompile(project)
// @req OPS-SVL-001
// The servlet.md ServletConfigurer blocks compile in DocsExamplesCompileTest; the classes they load (ServletConfigurer,
// RestApp) reference no Servlet API type, so the root test classpath needs no javax.servlet artifact.
def rootServletTestDependency = project(':NaruServe-servlet')
// @req FR-REL-002
// @req FR-REL-003
// The plain-Java release tools compile and run their unit tests in the default build; release.gradle runs them.
sourceSets.test.java.srcDir 'gradle/release-tools'
// @req OPS-DX-001 — compile the actual runnable Java example.
sourceSets.test.java.srcDir 'examples/java/src/main/java'
dependencies {
    testImplementation 'junit:junit:4.13.2'
    // docs/api type blocks such as UploadFile carry @Nullable (OPS-MULTIPART-001 AC-1).
    testImplementation 'org.jspecify:jspecify:1.0.0'
    testImplementation gradleTestKit()
    // @req OPS-HTTP-004
    testImplementation project(':NaruServe-api')
    testImplementation testFixtures(project(':NaruServe-api'))
    // @req OPS-ENGINE-002
    testImplementation project(':NaruServe-gson')
    testRuntimeOnly project(':NaruServe')
    // @req OPS-SVL-001
    testImplementation rootServletTestDependency
}
// @req FR-REL-005
// checkCentralStaging stages all ten modules from scratch and fails rather than stage nine without the AAR.
def centralStagingDir = layout.buildDirectory.dir('central-staging')
def cleanCentralStaging = tasks.register('cleanCentralStaging', Delete) {
    delete centralStagingDir
}
def stagedProjects = androidProject != null ? naruProjects + [androidProject] : naruProjects
def publishToCentralStaging = stagedProjects.collect { "${it.path}:publishAllPublicationsToCentralStagingRepository" }
tasks.register('checkCentralStaging') {
    group = 'publishing'
    description = 'Publishes the ten modules to build/central-staging and checks the files Maven Central needs.'
    dependsOn cleanCentralStaging, publishToCentralStaging
    def ids = (naruModules + [':NaruServe-android']).collect { it.substring(1).toLowerCase(Locale.ROOT) }.toSorted()
    def stagedVersion = version
    doLast {
        def group = centralStagingDir.get().dir('com/snoworca/naruserve').asFile
        def found = (group.listFiles()?.findAll { it.isDirectory() }*.name ?: []).toSorted()
        if (found != ids) {
            throw new GradleException("central-staging holds ${found}, expected ${ids}")
        }
        ids.each { id ->
            [id == 'naruserve-android' ? '.aar' : '.jar', '-sources.jar', '-javadoc.jar', '.pom', '.module'].each { suffix ->
                def f = new File(group, "${id}/${stagedVersion}/${id}-${stagedVersion}${suffix}")
                if (!f.isFile()) {
                    throw new GradleException("central-staging misses ${f}")
                }
            }
        }
        logger.lifecycle("central-staging: ${ids.size()} artifactIds at ${stagedVersion}: ${ids.join(', ')}")
    }
}
gradle.taskGraph.whenReady { graph ->
    if (androidProject == null && graph.hasTask(':checkCentralStaging')) {
        throw new GradleException('checkCentralStaging needs NaruServe-android: no Android SDK found in '
                + 'local.properties sdk.dir, ANDROID_HOME or ANDROID_SDK_ROOT')
    }
}

test {
    useJUnit()
    dependsOn checkDependencyRules
    dependsOn naruModules.collect { "${it}:testClasses" }
    // con_BUILD_006_AC8 reads this jar.
    dependsOn ':NaruServe-api:testFixturesJar'
    mustRunAfter naruModules.collect { "${it}:check" }
    // The checks read files outside this task's inputs, so never skip them as up to date.
    outputs.upToDateWhen { false }
    systemProperty 'naruserve.rootDir', rootDir.absolutePath
    systemProperty 'naruserve.tinyHttpdDir', gradle.ext.tinyHttpdDir.absolutePath
    systemProperty 'naruserve.tinyHttpdFromMaven', providers.gradleProperty('tinyHttpdFromMaven').getOrElse('false')
    systemProperty 'naruserve.depReport', dependencyReport.get().asFile.absolutePath
    systemProperty 'naruserve.gradleHome', gradle.gradleHomeDir.absolutePath
    systemProperty 'naruserve.gradleUserHome', gradle.gradleUserHomeDir.absolutePath
    systemProperty 'naruserve.offline', gradle.startParameter.offline
    systemProperty 'naruserve.testKitWorkDir', layout.buildDirectory.dir('testkit-work').get().asFile.absolutePath
    // @req FR-REL-005
    // PublishedPomTest reads the generated POMs; no nested Gradle build runs inside the test.
    def pomFilesProperty = naruProjects.collect { it.layout.buildDirectory
            .file('publications/maven/pom-default.xml').get().asFile.absolutePath }.join(',')
    dependsOn naruModules.collect { "${it}:generatePomFileForMavenPublication" }
    systemProperty 'naruserve.pomFiles', pomFilesProperty
    // CentralStagingTest reads a freshly published staging directory.
    dependsOn cleanCentralStaging, publishToCentralStaging
    systemProperty 'naruserve.centralStaging', centralStagingDir.get().asFile.absolutePath
    // @req FR-BUILD-001
    // BuildLayoutTest reads the release AAR; the published AAR's POM joins the others.
    systemProperty 'naruserve.androidIncluded', androidProject != null
    systemProperty 'naruserve.androidSdkDir', String.valueOf(gradle.ext.androidSdkDir)
    if (androidProject != null) {
        dependsOn ':NaruServe-android:bundleReleaseAar', ':NaruServe-android:generatePomFileForReleasePublication'
        def aar = androidProject.layout.buildDirectory.file('outputs/aar/NaruServe-android-release.aar').get().asFile
        systemProperty 'naruserve.androidAar', aar.absolutePath
        systemProperty 'naruserve.pomFiles', pomFilesProperty + ',' + androidProject.layout.buildDirectory
                .file('publications/release/pom-default.xml').get().asFile.absolutePath
    }
}

