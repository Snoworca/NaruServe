// The Android Gradle Plugin of NaruServe-android resolves from Google's repository (FR-BUILD-001).
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
    }
}

// The root project is not a module: NaruServe is the bootstrap module's name (W2-001).
rootProject.name = 'NaruServe-build'

include ':NaruServe-api'
include ':NaruServe-servlet'
include ':NaruServe-tinyhttpd'
include ':NaruServe-gson'
include ':NaruServe'
include ':NaruServe-kotlin'
include ':NaruServe-slf4j'
include ':NaruServe-filelog'
include ':NaruServe-logcat'

// @req FR-BUILD-001
// The Android library needs an SDK: the first existing directory of local.properties sdk.dir, ANDROID_HOME and
// ANDROID_SDK_ROOT; without one the other nine modules still build.
def localProperties = new Properties()
def localPropertiesFile = new File(settingsDir, 'local.properties')
if (localPropertiesFile.isFile()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def androidSdk = [localProperties.getProperty('sdk.dir'),
                  providers.environmentVariable('ANDROID_HOME').getOrNull(),
                  providers.environmentVariable('ANDROID_SDK_ROOT').getOrNull()]
        .findAll { it }.collect { new File(it) }.find { it.isDirectory() }
gradle.ext.androidSdkDir = androidSdk
if (androidSdk != null) {
    include ':NaruServe-android'
} else {
    logger.warn('NaruServe-android is not built: no Android SDK found in local.properties sdk.dir, ANDROID_HOME or ANDROID_SDK_ROOT')
}

// @req OPS-BUILD-001
// Absolute default, so a git worktree of this repository resolves the same read-only TinyHttpd checkout.
def tinyHttpdPath = providers.gradleProperty('tinyHttpdDir').getOrElse('/Users/beom/work/git/TinyHttpd')
// A relative override resolves against this directory, not the daemon's working directory.
def tinyHttpdDir = new File(tinyHttpdPath).isAbsolute() ? new File(tinyHttpdPath) : new File(settingsDir, tinyHttpdPath)
def tinyHttpdFromMaven = providers.gradleProperty('tinyHttpdFromMaven').getOrElse('false').toBoolean()
if (!tinyHttpdFromMaven && !tinyHttpdDir.isDirectory()) {
    throw new GradleException("tinyHttpdDir: TinyHttpd checkout not found at ${tinyHttpdDir.path}")
}
gradle.ext.tinyHttpdDir = tinyHttpdDir
if (!tinyHttpdFromMaven) {
    includeBuild(tinyHttpdDir)
}

// Docs cite the TinyHttpd commit this build was verified against; warn (never fail) when the checkout differs.
def verifiedTinyHttpd = '165f365' // TinyHttpd 3.1.0: headers and transport abort
if (!tinyHttpdFromMaven) {
    try {
        def head = providers.exec {
            commandLine 'git', '-C', tinyHttpdDir.path, 'rev-parse', '--short=7', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
        if (head != verifiedTinyHttpd) {
            logger.warn("tinyHttpdDir: TinyHttpd HEAD is '${head}', but NaruServe was verified against ${verifiedTinyHttpd}")
        }
    } catch (Exception e) {
        logger.warn("tinyHttpdDir: could not read the TinyHttpd commit (${e.message}); NaruServe was verified against ${verifiedTinyHttpd}")
    }
}
